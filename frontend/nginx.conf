# Cuando hay HTTPS, Caddy va delante y manda el esquema original. Si se entra directo, es el de nginx.
map $http_x_forwarded_proto $esquema {
    default $http_x_forwarded_proto;
    "" $scheme;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # Resuelve el nombre del backend en cada petición. Así nginx sigue encontrando la API
    # cuando el contenedor del backend se reinicia con una IP nueva.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # La IP real del visitante llega de Caddy, que vive en la red interna de Docker.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    location /api/ {
        set $api http://backend:8000;
        proxy_pass $api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $esquema;
        proxy_set_header Accept application/json;
    }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /brand/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
