<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- Portada provisional de ¿Llamo al 911?, hasta tener la ilustración (ver juegos/llamada-911/LEEME.md) -->
  <rect width="960" height="540" fill="#fff1d6"/>
  <g fill="#f6dfae">
    <circle cx="120" cy="110" r="80"/><circle cx="860" cy="440" r="110"/><circle cx="820" cy="90" r="40"/>
  </g>
  <!-- Teléfono -->
  <g transform="translate(150 70)">
    <rect x="0" y="0" width="250" height="410" rx="38" fill="#20302a" stroke="#003d24" stroke-width="8"/>
    <rect x="22" y="40" width="206" height="80" rx="16" fill="#eaf7ef"/>
    <text x="125" y="102" text-anchor="middle" font-family="Barlow Condensed, Impact, sans-serif" font-weight="800" font-size="62" fill="#003d24" letter-spacing="6">911</text>
    <g fill="#f4f7f5" stroke="#0e1a15" stroke-width="4">
      <circle cx="55" cy="170" r="26"/><circle cx="125" cy="170" r="26"/><circle cx="195" cy="170" r="26"/>
      <circle cx="55" cy="236" r="26"/><circle cx="125" cy="236" r="26"/><circle cx="195" cy="236" r="26"/>
      <circle cx="55" cy="302" r="26"/><circle cx="125" cy="302" r="26"/><circle cx="195" cy="302" r="26"/>
    </g>
    <circle cx="125" cy="366" r="28" fill="#1fa45a" stroke="#0e1a15" stroke-width="4"/>
    <path d="M113 354c4 10 10 17 20 22l5-5c1-1 3-1 4-1 3 1 6 2 9 2 1 0 2 1 2 2v8c0 1-1 2-2 2-23 0-41-18-41-41 0-1 1-2 2-2h8c1 0 2 1 2 2 0 3 1 6 2 9 0 1 0 3-1 4z" fill="#fff"/>
  </g>
  <!-- Ondas de llamada -->
  <g fill="none" stroke="#dd971a" stroke-width="14" stroke-linecap="round">
    <path d="M440 180a120 120 0 010 140"/>
    <path d="M490 140a180 180 0 010 220"/>
  </g>
  <!-- Burbujas sí / no -->
  <g font-family="Baloo 2, DM Sans, sans-serif" font-weight="800" font-size="46" text-anchor="middle">
    <rect x="560" y="120" width="290" height="110" rx="30" fill="#ffebee" stroke="#003d24" stroke-width="7"/>
    <text x="705" y="192" fill="#b3121f">¿Sí llamo?</text>
    <rect x="560" y="290" width="290" height="110" rx="30" fill="#e6f4ec" stroke="#003d24" stroke-width="7"/>
    <text x="705" y="362" fill="#00723f">¿No llamo?</text>
  </g>
</svg>
