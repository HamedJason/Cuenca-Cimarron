<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2c3333" />
    <title>El Tecolote · Misión Tijuana</title>
    <!-- Los estilos van en el HTML (no en el JS) para que la pantalla de carga se vea bien desde el primer momento. -->
    <script type="module" crossorigin src="./assets/tecolote-BaOkiMMI.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/desbloqueo-BA9A0MQU.js">
    <link rel="modulepreload" crossorigin href="./assets/voxel-DQI6LTmU.js">
    <link rel="modulepreload" crossorigin href="./assets/routes-8JKZ6jgn.js">
    <link rel="modulepreload" crossorigin href="./assets/zona-B71k0pJE.js">
    <link rel="modulepreload" crossorigin href="./assets/motor-9PeCOxeb.js">
    <link rel="modulepreload" crossorigin href="./assets/piezas-BVgLVRg_.js">
    <link rel="stylesheet" crossorigin href="./assets/tecolote-sJwQ0g97.css">
  </head>
  <body>
    <h1 class="sr-only">Misión Tijuana: inundación en El Tecolote</h1>
    <div id="marcas" aria-hidden="true"></div>
    <!-- La misma barra que las otras experiencias; los botones se conectan en src/design/barra.ts. -->
    <header class="barra barra-experiencia">
      <a class="brand barra-boton" href="./index.html" title="Volver al inicio" aria-label="Misión Tijuana: volver al inicio">
        <svg class="home-ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M3 11 12 4l9 7M5 10v10h14V10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="titulo name">Misión Tijuana</span>
      </a>
      <p class="experiencia">Inundación · El Tecolote</p>
      <div class="tools">
        <span id="misiones"></span>
        <button id="movimiento" class="barra-boton icon" type="button" aria-pressed="false" title="Reducir animaciones"></button>
        <button id="sonido" class="barra-boton icon" type="button" aria-pressed="true" title="Silenciar"></button>
      </div>
    </header>

    <!-- Narración corta arriba. -->
    <p id="narracion" class="narracion" aria-live="polite" hidden></p>

    <!-- Viñeta: acercamiento animado antes de decidir. -->
    <div id="vineta" class="vineta" hidden>
      <canvas></canvas>
      <p id="vineta-texto" class="vineta-texto" aria-live="polite"></p>
      <button id="vineta-seguir" class="btn btn-primary" type="button">Continuar</button>
    </div>

    <!-- Decisión: el juego se congela y el fondo se difumina. -->
    <div id="decision" class="decision" role="dialog" aria-modal="true" aria-labelledby="dec-titulo" hidden></div>

    <!-- Dibujos paso a paso (la llamada, los avisos del teléfono). -->
    <div id="pasos" class="pasos" role="dialog" aria-modal="true" hidden></div>

    <!-- Corte de escena a negro. -->
    <div id="corte" class="corte" aria-live="polite" hidden></div>

    <!-- Lo que pasó al elegir. -->
    <div id="resultado" class="resultado" role="status" hidden></div>

    <!-- Inicio y final. -->
    <div id="tarjeta" class="tarjeta panel" hidden></div>

    <div id="cargando" class="aviso-escena" role="status">
      <div class="panel">
        <h2>Cargando El Tecolote</h2>
        <p>Armando las calles, las casas y el arroyo.</p>
        <div class="carga-barra"><i></i></div>
      </div>
    </div>
  </body>
</html>
