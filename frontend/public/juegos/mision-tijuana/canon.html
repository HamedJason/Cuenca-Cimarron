<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2c3333" />
    <title>Cañón del Pato · Misión Tijuana</title>
      <!-- Los estilos van en el HTML (no en el JS) para que la pantalla de carga se vea bien desde el primer momento. -->
    <script type="module" crossorigin src="./assets/canon-TVuN5s0F.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/desbloqueo-C4Y22POx.js">
    <link rel="modulepreload" crossorigin href="./assets/voxel-CAjESE0L.js">
    <link rel="modulepreload" crossorigin href="./assets/routes-C3ApLIzn.js">
    <link rel="modulepreload" crossorigin href="./assets/plegable-r3pHvj-l.js">
    <link rel="modulepreload" crossorigin href="./assets/cabecera-D6K_MAwd.js">
    <link rel="stylesheet" crossorigin href="./assets/canon-Dkb1ImaC.css">
  </head>
  <body>
    <h1 class="sr-only">Misión Tijuana: Cañón del Pato</h1>
    <div id="marcas" aria-hidden="true"></div>
    <!-- La misma barra que la misión principal (src/components/TopBar.vue); los botones se conectan en src/design/barra.ts. -->
    <header class="barra barra-experiencia">
      <a class="brand barra-boton" href="./index.html" title="Volver al inicio" aria-label="Misión Tijuana: volver al inicio">
        <svg class="home-ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M3 11 12 4l9 7M5 10v10h14V10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="titulo name">Misión Tijuana</span>
      </a>
      <p class="experiencia">Inundación · Cañón del Pato</p>
      <div class="tools">
        <span id="misiones"></span>
        <a class="barra-boton" href="./index.html?nino" title="¿Qué es El Niño?" aria-label="¿Qué es El Niño?">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M3 15c2.2 0 2.2-1.6 4.5-1.6S9.8 15 12 15s2.3-1.6 4.5-1.6S18.8 15 21 15M3 19c2.2 0 2.2-1.6 4.5-1.6S9.8 19 12 19s2.3-1.6 4.5-1.6S18.8 19 21 19M12 4v2M6.3 6.3l1.4 1.4M17.7 6.3l-1.4 1.4M8.5 11a3.5 3.5 0 0 1 7 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" />
          </svg>
          <span class="txt">El Niño</span>
        </a>
        <button id="movimiento" class="barra-boton icon" type="button" aria-pressed="false" title="Reducir animaciones"></button>
        <button id="sonido" class="barra-boton icon" type="button" aria-pressed="true" title="Silenciar"></button>
      </div>
    </header>
    <!-- Layout común (docs/layout.md): la historia a la izquierda (abajo en celular) y Explora a la derecha (arriba). -->
    <main id="panel" class="panel lado lado-izq" aria-live="polite"></main>
    <aside id="lado-der" class="panel lado lado-der" aria-label="Explora"></aside>
    <div id="cargando" class="aviso-escena" role="status">
      <div class="panel">
        <h2>Cargando la zona</h2>
        <p>Armando el relieve, las calles y las casas reales.</p>
        <div class="carga-barra"><i></i></div>
      </div>
    </div>
  </body>
</html>
