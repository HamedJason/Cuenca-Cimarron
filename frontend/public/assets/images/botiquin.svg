<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Botiquín abierto con gasas, vendas, tijeras y un termómetro">
  <!-- Fondo: pared clara con lluvia por la ventana -->
  <rect width="960" height="540" fill="#eaf2ff"/>
  <rect x="610" y="50" width="270" height="200" rx="18" fill="#bcd6f5" stroke="#3b2314" stroke-width="6"/>
  <path d="M745 50v200M610 150h270" stroke="#3b2314" stroke-width="6"/>
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".85">
    <path d="M640 75l-10 22M690 95l-10 22M660 175l-10 22M710 190l-10 22M775 80l-10 22M830 110l-10 22M790 175l-10 22M850 190l-10 22"/>
  </g>
  <!-- Mesa -->
  <rect x="0" y="410" width="960" height="130" fill="#e8dcc4"/>
  <path d="M0 410h960" stroke="#3b2314" stroke-width="6"/>
  <!-- Tapa abierta -->
  <path d="M150 200 200 120h420l50 80Z" fill="#ffffff" stroke="#3b2314" stroke-width="7" stroke-linejoin="round"/>
  <rect x="380" y="140" width="60" height="44" rx="8" fill="#e53935" stroke="#3b2314" stroke-width="5"/>
  <path d="M410 148v28M396 162h28" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <!-- Caja -->
  <rect x="150" y="200" width="520" height="230" rx="22" fill="#e53935" stroke="#3b2314" stroke-width="7"/>
  <rect x="180" y="226" width="460" height="74" rx="12" fill="#b71c1c" stroke="#3b2314" stroke-width="5"/>
  <!-- Cruz al frente -->
  <rect x="368" y="318" width="84" height="84" rx="14" fill="#ffffff" stroke="#3b2314" stroke-width="6"/>
  <path d="M410 334v52M384 360h52" stroke="#e53935" stroke-width="16" stroke-linecap="round"/>
  <!-- Venda en rollo -->
  <g transform="translate(205 168)">
    <rect x="0" y="0" width="92" height="92" rx="46" fill="#ffffff" stroke="#3b2314" stroke-width="6"/>
    <circle cx="46" cy="46" r="18" fill="#f3e8c8" stroke="#3b2314" stroke-width="5"/>
    <path d="M70 84c30 6 50 18 64 40" fill="none" stroke="#3b2314" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- Gasas -->
  <g transform="rotate(-8 360 200)">
    <rect x="315" y="160" width="96" height="74" rx="8" fill="#ffffff" stroke="#3b2314" stroke-width="6"/>
    <path d="M330 182h66M330 200h66M330 218h40" stroke="#c9d1d4" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Frasco de antiséptico -->
  <g>
    <rect x="452" y="140" width="62" height="110" rx="12" fill="#ffc83d" stroke="#3b2314" stroke-width="6"/>
    <rect x="466" y="116" width="34" height="30" rx="6" fill="#1e5fbf" stroke="#3b2314" stroke-width="5"/>
    <rect x="460" y="176" width="46" height="34" rx="5" fill="#ffffff" stroke="#3b2314" stroke-width="4"/>
  </g>
  <!-- Termómetro -->
  <g transform="rotate(28 600 190)">
    <rect x="585" y="110" width="30" height="150" rx="15" fill="#ffffff" stroke="#3b2314" stroke-width="6"/>
    <rect x="594" y="170" width="12" height="70" rx="6" fill="#e53935"/>
    <circle cx="600" cy="246" r="14" fill="#e53935" stroke="#3b2314" stroke-width="5"/>
  </g>
  <!-- Tijeras sobre la mesa -->
  <g transform="translate(730 380) rotate(-18)">
    <path d="M0 0 120 -28M0 -40 120 -12" stroke="#7c8a99" stroke-width="10" stroke-linecap="round"/>
    <circle cx="-20" cy="6" r="22" fill="none" stroke="#1e5fbf" stroke-width="9"/>
    <circle cx="-20" cy="-46" r="22" fill="none" stroke="#1e5fbf" stroke-width="9"/>
  </g>
  <!-- Curitas -->
  <g transform="translate(90 455) rotate(-12)">
    <rect x="0" y="0" width="110" height="38" rx="19" fill="#f2b79a" stroke="#3b2314" stroke-width="5"/>
    <rect x="38" y="6" width="34" height="26" rx="5" fill="#fad6c4"/>
  </g>
  <g transform="translate(250 470) rotate(10)">
    <rect x="0" y="0" width="110" height="38" rx="19" fill="#f2b79a" stroke="#3b2314" stroke-width="5"/>
    <rect x="38" y="6" width="34" height="26" rx="5" fill="#fad6c4"/>
  </g>
  <!-- Guantes -->
  <path d="M760 470c0-30 10-48 26-48s20 10 20 22v-30c0-10 16-10 16 0v30-38c0-10 16-10 16 0v38-30c0-10 16-10 16 0v44c0 22-14 40-40 40h-30c-12 0-20-10-20-28Z" fill="#cfe4ff" stroke="#3b2314" stroke-width="5" stroke-linejoin="round"/>
</svg>
