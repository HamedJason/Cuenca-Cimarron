# Configuración para el servidor. Usa las imágenes que GitHub publica en cada cambio a main
# y Watchtower las descarga y reinicia el sitio sin intervención manual.
# Uso: docker compose -f compose.servidor.yaml up -d
name: cuenca-cimarron
services:
  frontend:
    image: ghcr.io/hamedjason/cuenca-cimarron-frontend:${VERSION:-latest}
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8090}:80"
    depends_on:
      backend:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped
  backend:
    image: ghcr.io/hamedjason/cuenca-cimarron-backend:${VERSION:-latest}
    environment:
      APP_NAME: Cuenca Cimarrona
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Falta APP_KEY en el archivo .env}
      APP_URL: ${APP_URL:-http://localhost:8090}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: cuenca
      DB_USERNAME: cuenca
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el archivo .env}
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cuenca
      POSTGRES_USER: cuenca
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el archivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuenca -d cuenca"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  watchtower:
    image: nickfedor/watchtower:latest
    command: --label-enable --cleanup --interval ${REVISAR_CADA:-300}
    environment:
      TZ: America/Tijuana
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
volumes:
  postgres_data:
